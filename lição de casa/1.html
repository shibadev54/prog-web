<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- nome data nasc e cálculo de idade (aprox)-->
     <form>
        <label>
            seu nome
        </label>
        <input name="nome" id="nome" required></input>
        <label> ano nasc</label>
        <input name="data" id="data" type="text" minlength="4" required></input>
        
     </form>
     <button type="submit" onclick="getvalue()">envie</button>
     <p id="mostra nome"> </p>
     <p id="mostra data"></p>
    <script>
        function getvalue(){     
     const nome= document.getElementById("nome").value;
     const data= document.getElementById("data").value;
     document.getElementById("mostra nome").innerHTML = nome;
     const idade = 2026 - data;
     document.getElementById("mostra data").innerHTML = idade + " anos";
     }
     
    </script>
    <style> p{font-size: xx-large;}</style>
</body>
</html>
