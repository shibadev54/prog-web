<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro</title>

<style>
* {
  box-sizing: border-box;
}

body {
  background-color: gray;
  margin: 0;
  font-family: Arial, sans-serif;
}

main {
  width: 95%;
  max-width: 1200px;
  margin: 40px auto;
  padding: 30px;
  background: white;
  border-radius: 15px;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.incluir {
  padding: 12px 20px;
  font-size: 16px;
  border-radius: 8px;
  background-color: blue;
  color: white;

}

.cabecalho {
  display: flex;
  justify-content: space-between;
  margin-top: 30px;
  font-weight: bold;
}

.users {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 0;
  border-bottom: 1px solid #ddd;
}
.actions {
  display: flex;
  gap: 15px;
}

.users button {
  border: none;
  background: transparent;
  font-size: 40px;
  cursor: pointer;
}

h1 {
  margin: 0;
}
body {
  background: #555;
}
</style>
</head>

<body>

<main>

<header>
  <h1>Cadastro de usuários</h1>
  <button class="incluir" onclick="form()">Incluir</button>
</header>

<div class="cabecalho">
  <span>Nome</span>
  <span>editar deletar</span>
</div>

<div class="users">
  <p>Julia</p>
  <div class="actions">
    <button>&#x270E</button>
    <button>&#128465</button>
  </div>
</div>

</main>



</body>
</html>
