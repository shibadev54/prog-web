<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro</title>

<style>
* {
  box-sizing: border-box;
}

body {
  background-color: gray;
  margin: 0;
  font-family: Arial, sans-serif;
}

main {
  width: 95%;
  max-width: 1200px;
  margin: 40px auto;
  padding: 30px;
  background: white;
  border-radius: 15px;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.incluir {
  padding: 12px 20px;
  font-size: 16px;
  border-radius: 8px;
  background-color: blue;
  color: white;

}

.cabecalho {
  display: flex;
  justify-content: space-between;
  margin-top: 30px;
  font-weight: bold;
}

.users {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 0;
  border-bottom: 1px solid #ddd;
}
.actions {
  display: flex;
  gap: 15px;
}

.users button {
  border: none;
  background: transparent;
  font-size: 40px;
  cursor: pointer;
}

h1 {
  margin: 0;
}
body {
  background: #555;
}
 dialog button{
   color:white;
   background-color:blue;
   padding:0px 30px 0px 30px;
 }
 input{
   background-color:transparent;
 }
</style>
</head>

<body>

<main>

<header>
  <h1>Cadastro de usuários</h1>
  <button id="abremodal" class="incluir" onclick="form()">Incluir</button>
</header>

<div class="cabecalho">
  <span>Nome</span>
  <span>editar deletar</span>
</div>

<div class="users">
  <p>Julia</p>
  <div class="actions">
    <button>&#x270E</button>
    <button>&#128465</button>
  </div>
</div>
<dialog><h2>nome</h2>
  <input>
  <h2>função</h2>
  <input>
  <h2>salário</h2>
  <input><br>
  <center><button id="fechamodal"> salvar</button></center>
</dialog>
</main>
  <!- padding no botao, input invisivel e 1px de borda no topo->
<script>
let abremodal = document.getElementById("abremodal");
let modal = document.getElementsByTagName("dialog");
let fechamodal = document.getElementById("fechamodal");
abremodal.onclick = () => modal[0].showModal();
fechamodal.onclick = () => modal[0].close();
</script>
</body>
</html>
